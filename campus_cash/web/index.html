    *{box-sizing:border-box;margin:0}
    html,body{height:100%;background:#05493D;overflow:hidden}
    .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#1F9D68 0,#05493D 100%);color:#fff;font-family:Figtree,system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 24px env(safe-area-inset-bottom,0px);overflow:hidden;z-index:99999}
    .logo{position:relative;width:min(74vw,290px);aspect-ratio:560/428;perspective:900px}
    .logo:before{content:"";position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;margin:-35% 0 0 -35%;border-radius:50%;border:2px solid rgba(255,255,255,.55);opacity:0;animation:rip 1.2s 2.2s ease-out forwards}
    @keyframes rip{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(2.1)}}
    .pop{position:absolute;inset:0;opacity:0;animation:pop .8s .1s cubic-bezier(.2,.9,.2,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.55) rotate(-14deg)}to{opacity:1;transform:none}}
    .flip{position:absolute;inset:0;animation:flip 1.1s 1.2s cubic-bezier(.45,0,.2,1) both}
    @keyframes flip{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
    .mark{position:absolute;inset:0;background:var(--m) center/contain no-repeat;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
    .shine{position:absolute;inset:0;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.85) 50%,transparent 58%) 160% 0/260% 100% no-repeat;animation:sh 2.8s 2.5s ease-in-out infinite}
    @keyframes sh{0%{background-position:160% 0}55%,100%{background-position:-60% 0}}
    .word{margin-top:30px;font:800 40px 'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-.025em;opacity:0;transform:translateY(14px);animation:up .6s 1s cubic-bezier(.2,.8,.2,1) forwards}
    .word span{color:#FFB629}
    .tag{margin-top:6px;font-weight:500;font-size:16px;color:rgba(255,255,255,.85);opacity:0;transform:translateY(10px);animation:up .6s 1.25s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes up{to{opacity:1;transform:none}}
    .load{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 56px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fade .4s 1.7s forwards}
    @keyframes fade{to{opacity:1}}
    .bar{width:132px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
    .bar i{display:block;width:45%;height:100%;border-radius:4px;background:#fff;animation:sl 1.3s ease-in-out infinite}
    @keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}
    .load small{font-size:13px;color:rgba(255,255,255,.85);font-weight:500}
    .replay{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font:600 13px Figtree,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer}
    .replay:focus-visible{outline:3px solid #fff;outline-offset:2px}
    @media(prefers-reduced-motion:reduce){.logo:before,.shine,.bar i{animation:none}.logo:before,.shine{display:none}.pop{animation:none;opacity:1}.flip{animation:none}.word,.tag{animation:none;opacity:1;transform:none}.load{animation:none;opacity:1}.bar i{width:100%}}
  </style>
</head>
<body>
  <main class="splash" id="root" aria-busy="true" aria-label="CashMate is loading">
    <button class="replay" id="rp">&#8635; Replay</button>
    <div class="logo" role="img" aria-label="CashMate logo">
      <div class="pop">
        <div class="flip">
          <div class="mark"></div>
          <div class="shine"></div>
        </div>
      </div>
    </div>
    <div class="word">Cash<span>Mate</span></div>
    <p class="tag">Find your exact cash match.</p>
    <div class="load">
      <div class="bar"><i></i></div>
      <small>Finding people near you</small>
    </div>
  </main>

  <script>
    function replay(){var r=document.getElementById('root'),c=r.cloneNode(true);r.replaceWith(c);c.querySelector('#rp').onclick=replay}
    var rp=document.getElementById('rp');
    if(rp) rp.onclick=replay;

    function dismissSplash() {
      var r = document.getElementById('root');
      if (r && !r.dataset.dismissed) {
        r.dataset.dismissed = 'true';
        r.style.transition = 'opacity 0.6s ease-out';
        r.style.opacity = '0';
        setTimeout(function() {
          if (r && r.parentNode) r.parentNode.removeChild(r);
        }, 600);
      }
    }

    // Dismiss when Flutter sends first frame event
    window.addEventListener('flutter-first-frame', function() {
      setTimeout(dismissSplash, 1200);
    });

    // Fallback: observe when Flutter view DOM mounts
    var observer = new MutationObserver(function() {
      var v = document.querySelector('flutter-view') || document.querySelector('flt-glass-pane');
      if (v) {
        setTimeout(dismissSplash, 2000);
        observer.disconnect();
      }
    });
    if (document.body) {
      observer.observe(document.body, { childList: true, subtree: true });
    }
  </script>

  <!-- Flutter Web Bootstrapper -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
